name: Update PR Count

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Run script
        env:
          GITHUB_USERNAME: ${{ secrets.GITHUB_USERNAME }}  # Можно задать в Secrets
        run: |
          pip install requests
          python update_pr_count.py

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add README.md
          git commit -m "Update PR count"
          git push